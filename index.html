<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SAT Vocab: Ultimate Edition</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
overflow:hidden;
text-align:center;
}

.card{
max-width:900px;
margin:auto;
padding:20px;
}

.hidden{display:none;}

button{
padding:12px;
margin:5px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.choice{background:#334155;color:white;}
.choice:hover{transform:scale(1.05);}

.correct{background:#22c55e!important;animation:pulse 0.3s;}
.wrong{background:#ef4444!important;animation:shake 0.3s;}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.1)}
100%{transform:scale(1)}
}

@keyframes shake{
0%{transform:translateX(0)}
25%{transform:translateX(-5px)}
50%{transform:translateX(5px)}
100%{transform:translateX(0)}
}

.boss{
background:#7c3aed;
animation:flash 0.5s infinite alternate;
}

@keyframes flash{
from{filter:brightness(1)}
to{filter:brightness(2)}
}

.coin{
position:absolute;
animation:floatUp 1s ease-out forwards;
color:gold;
font-weight:bold;
}

@keyframes floatUp{
from{transform:translateY(0);opacity:1}
to{transform:translateY(-80px);opacity:0}
}

</style>
</head>

<body>

<div class="card" id="menu">

<h1>⚡ SAT VOCAB ULTIMATE ⚡</h1>

<button onclick="start()">Start Game</button>

<h3>🏆 Leaderboard</h3>
<div id="board"></div>

</div>

<div class="card hidden" id="game">

<h2>Score: <span id="score">0</span></h2>
<h3>Coins: <span id="coins">0</span></h3>
<h3>Prestige: ⭐ <span id="prestige">0</span></h3>

<h3 id="question"></h3>

<div id="choices"></div>

</div>

<script>

/* ================= DATA ================= */

const words=[
{w:"abstract",d:"general; not concrete",r:"common"},
{w:"aesthetic",d:"beauty related",r:"rare"},
{w:"alleviate",d:"to ease pain",r:"common"},
{w:"ambivalent",d:"mixed feelings",r:"rare"},
{w:"apathetic",d:"no emotion",r:"common"},
{w:"egregious",d:"extremely bad",r:"epic"},
{w:"vindicated",d:"cleared of blame",r:"legendary"}
];

/* ================= STATE ================= */

let score=0;
let coins=0;
let prestige=0;
let qCount=0;
let current;

/* ================= SOUND ================= */

function beep(freq){
let ctx=new AudioContext();
let o=ctx.createOscillator();
o.frequency.value=freq;
o.connect(ctx.destination);
o.start();
o.stop(ctx.currentTime+0.1);
}

/* ================= GAME ================= */

function start(){
document.getElementById("menu").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");
next();
loadBoard();
}

function rarityMult(r){
if(r==="common")return 1;
if(r==="rare")return 1.5;
if(r==="epic")return 2;
return 3;
}

function next(){

qCount++;

let boss=qCount%8===0;

current=words[Math.floor(Math.random()*words.length)];

if(boss){
document.getElementById("question").innerHTML="👹 BOSS ROUND: "+current.d;
document.body.classList.add("boss");
}else{
document.getElementById("question").innerHTML=current.d;
document.body.classList.remove("boss");
}

let choices=[current];

while(choices.length<4){
let r=words[Math.floor(Math.random()*words.length)];
if(!choices.includes(r))choices.push(r);
}

choices.sort(()=>Math.random()-0.5);

let box=document.getElementById("choices");
box.innerHTML="";

choices.forEach(c=>{
let b=document.createElement("button");
b.className="choice";
b.innerText=c.w;

b.onclick=()=>check(c,b,boss);

box.appendChild(b);
});
}

function check(c,btn,boss){

document.querySelectorAll("button").forEach(b=>b.disabled=true);

let correct=c.w===current.w;

if(correct){

beep(600);

let gain=100*rarityMult(current.r);

if(boss)gain*=3;

score++;
coins+=gain+prestige*10;

btn.classList.add("correct");

spawnCoin(gain);

}else{

beep(200);

btn.classList.add("wrong");

coins-=50;
screenShake();
}

update();

setTimeout(next,900);
}

function spawnCoin(val){
let d=document.createElement("div");
d.className="coin";
d.innerText="+"+val;
d.style.left="50%";
document.body.appendChild(d);
setTimeout(()=>d.remove(),1000);
}

function screenShake(){
document.body.style.transform="translateX(10px)";
setTimeout(()=>document.body.style.transform="translateX(0)",100);
}

function update(){

document.getElementById("score").innerText=score;
document.getElementById("coins").innerText=coins;
document.getElementById("prestige").innerText=prestige;

if(score>=10){
prestige++;
score=0;
coins=0;
alert("🔥 PRESTIGE UP!");
save();
}
}

function save(){
let board=JSON.parse(localStorage.getItem("board")||"[]");
board.push(prestige);
board.sort((a,b)=>b-a);
board=board.slice(0,5);
localStorage.setItem("board",JSON.stringify(board));
loadBoard();
}

function loadBoard(){
let board=JSON.parse(localStorage.getItem("board")||"[]");
document.getElementById("board").innerHTML=
board.map((b,i)=>`#${i+1} Prestige ${b}`).join("<br>");
}

</script>

</body>
</html>
